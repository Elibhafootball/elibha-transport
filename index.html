<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elibha Transport — Journey Planner</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17263b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#132a45;color:white;padding:19px max(22px,calc((100vw - 960px)/2));font-size:1.15rem;font-weight:750}main{max-width:960px;margin:70px auto;padding:0 20px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 12px}p{color:#5c6a7d}.panel{background:white;border:1px solid #dce4ed;border-radius:16px;padding:26px;box-shadow:0 10px 35px #12233d0b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;margin-bottom:8px}.field{position:relative}input[type=text],input[type=time]{width:100%;border:1px solid #b7c4d4;border-radius:9px;padding:13px 14px;font-size:1rem;background:white}input:focus{outline:2px solid #245ba4;outline-offset:1px}.suggestions{position:absolute;top:100%;left:0;right:0;z-index:10;background:white;border:1px solid #bdc9d7;border-radius:8px;box-shadow:0 12px 25px #14213b22;max-height:260px;overflow:auto;margin-top:4px}.suggestions button{display:block;width:100%;border:0;background:white;padding:11px 13px;text-align:left;cursor:pointer}.suggestions button:hover,.suggestions button:focus{background:#eaf2ff}.suggestions small{float:right;color:#66768a}.options{display:flex;align-items:center;gap:16px;margin:22px 0;flex-wrap:wrap}.options label{margin:0;font-weight:500}.search{background:#174c8b;color:white;border:0;border-radius:9px;padding:13px 30px;font-size:1rem;font-weight:700;cursor:pointer}.search:hover{background:#103d73}.note{margin-top:20px;font-size:.9rem}.status{margin-top:20px;padding:14px;border-radius:9px;background:#f0f5fc;color:#334d6f}@media(max-width:620px){main{margin:35px auto}.fields{grid-template-columns:1fr}.panel{padding:18px}}
</style></head><body><header>ELIBHA <span style="font-weight:400">TRANSPORT</span></header><main><h1>Where are you going?</h1><p>Plan journeys across Elibha's railways, Underground, ferries and domestic flights.</p><section class="panel"><div class="fields"><div class="field"><label for="from">From</label><input id="from" type="text" autocomplete="off" placeholder="Type a station or terminal" role="combobox" aria-autocomplete="list" aria-expanded="false"><div id="from-list" class="suggestions" hidden></div></div><div class="field"><label for="to">To</label><input id="to" type="text" autocomplete="off" placeholder="Type your destination" role="combobox" aria-autocomplete="list" aria-expanded="false"><div id="to-list" class="suggestions" hidden></div></div></div><div class="options"><div><label for="time">Depart after</label><input id="time" type="time" value="10:00"></div><label><input type="checkbox" id="flights"> Include flights</label></div><button class="search" id="search">Find journeys</button><div class="status" id="status" role="status">Station search is live. Timetable routing is being connected next.</div></section><p class="note" id="count"></p></main>
<script>
let stations=[];const selected={from:null,to:null};const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function setup(which){const input=document.getElementById(which),list=document.getElementById(which+'-list');function close(){list.hidden=true;input.setAttribute('aria-expanded','false')}function show(){const q=norm(input.value.trim());selected[which]=null;list.replaceChildren();if(!q){close();return}const matches=stations.filter(s=>norm(s.name).startsWith(q)).concat(stations.filter(s=>!norm(s.name).startsWith(q)&&norm(s.name).includes(q))).slice(0,12);for(const s of matches){const b=document.createElement('button');b.type='button';b.textContent=s.name;const small=document.createElement('small');small.textContent=s.code;b.appendChild(small);b.addEventListener('click',()=>{input.value=s.name;selected[which]=s;close()});list.appendChild(b)}list.hidden=!matches.length;input.setAttribute('aria-expanded',String(!!matches.length))}input.addEventListener('input',show);input.addEventListener('focus',show);input.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&!list.hidden){e.preventDefault();list.querySelector('button')?.click()}});document.addEventListener('click',e=>{if(!input.parentElement.contains(e.target))close()})}
async function init(){try{const r=await fetch('./data/stations.json');if(!r.ok)throw Error('Station data unavailable');stations=await r.json();document.getElementById('count').textContent=stations.length+' searchable stations, terminals and airports';setup('from');setup('to')}catch(e){document.getElementById('status').textContent='Could not load station data: '+e.message}}
document.getElementById('search').addEventListener('click',()=>{const status=document.getElementById('status');if(!selected.from||!selected.to){status.textContent='Please select an origin and destination from the suggestions.';return}status.textContent='Selected: '+selected.from.name+' → '+selected.to.name+'. The full timetable journey engine is the next build stage.'});init();
</script></body></html>
