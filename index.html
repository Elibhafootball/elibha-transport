<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elibha Transport — Journey Planner</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17263b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#132a45;color:white;padding:19px max(22px,calc((100vw - 960px)/2));font-size:1.15rem;font-weight:750}main{max-width:960px;margin:70px auto;padding:0 20px}h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 12px}p{color:#5c6a7d}.panel{background:white;border:1px solid #dce4ed;border-radius:16px;padding:26px;box-shadow:0 10px 35px #12233d0b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650;margin-bottom:8px}.field{position:relative}input[type=text],input[type=time]{width:100%;border:1px solid #b7c4d4;border-radius:9px;padding:13px 14px;font-size:1rem;background:white}input:focus{outline:2px solid #245ba4;outline-offset:1px}.suggestions{position:absolute;top:100%;left:0;right:0;z-index:10;background:white;border:1px solid #bdc9d7;border-radius:8px;box-shadow:0 12px 25px #14213b22;max-height:260px;overflow:auto;margin-top:4px}.suggestions button{display:block;width:100%;border:0;background:white;padding:11px 13px;text-align:left;cursor:pointer}.suggestions button:hover,.suggestions button:focus{background:#eaf2ff}.suggestions small{float:right;color:#66768a}.options{display:flex;align-items:center;gap:16px;margin:22px 0;flex-wrap:wrap}.options label{margin:0;font-weight:500}.search{background:#174c8b;color:white;border:0;border-radius:9px;padding:13px 30px;font-size:1rem;font-weight:700;cursor:pointer}.search:hover{background:#103d73}.note{margin-top:20px;font-size:.9rem}.status{margin-top:20px;padding:14px;border-radius:9px;background:#f0f5fc;color:#334d6f}@media(max-width:620px){main{margin:35px auto}.fields{grid-template-columns:1fr}.panel{padding:18px}}
.results-head{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px;gap:12px;flex-wrap:wrap}.journey{background:#fff;border:1px solid #dce4ed;border-radius:12px;margin:10px 0;padding:16px}.journey summary{cursor:pointer;list-style:none}.journey summary::-webkit-details-marker{display:none}.journey-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.times{font-size:1.4rem;font-weight:750}.subtle{color:#60718a;font-size:.88rem}.tag{font-size:.75rem;border-radius:6px;background:#eaf1fa;padding:4px 8px}.leg{padding:14px 0;border-top:1px solid #e1e8ef}.leg details{margin:8px 0}.leg summary{cursor:pointer;color:#174c8b}.stops{list-style:none;padding:0 0 0 14px;margin:10px 0;border-left:2px solid #cbd8e6}.stops li{padding:5px 12px;display:flex;gap:15px}.nav{display:flex;justify-content:space-between;margin:18px 0}.nav button{padding:10px 18px;background:white;border:1px solid #bdc9d7;border-radius:8px;cursor:pointer}.nav button:disabled{opacity:.4;cursor:default}

/* Journey card: readable station-to-station itinerary */
.journey{padding:0;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.journey:hover{border-color:#b7cbe2;box-shadow:0 3px 14px #12233d0b}
.journey-summary{padding:17px 20px;display:block}
.route-heading{display:flex;align-items:center;gap:16px;min-width:0;flex:1}
.endpoint{display:flex;flex-direction:column;gap:3px;min-width:0}
.endpoint .times{font-size:1.4rem;line-height:1.15}
.station-name{font-size:.86rem;font-weight:550;color:#52647a;overflow-wrap:anywhere}
.route-arrow{font-size:1.4rem;color:#8396ae;flex-shrink:0}
.journey-overview{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:14px}
.duration{color:#61738b;font-size:.86rem;white-space:nowrap}
.itinerary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.mode-chip{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:#e9f0fb;font-size:1.1rem;flex-shrink:0}
.mode-metro{background:#e9e8f9}.mode-ferry{background:#e4f4f4}.mode-flight{background:#f4ecfc}
.change-place{font-size:.88rem;font-weight:600;color:#253b55}
.change-arrow{color:#899bb1;font-size:1.2rem}
.journey-body{padding:0 20px 8px;border-top:1px solid #e4ebf3}
.leg-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.leg-mode{font-size:1.25rem}.walk-leg{color:#536983;font-size:.92rem}
@media(max-width:620px){.journey-summary{padding:15px}.route-heading{gap:10px}.endpoint .times{font-size:1.2rem}.station-name{font-size:.8rem}.journey-body{padding:0 15px 8px}.journey-overview{gap:9px}.itinerary{gap:6px}.change-place{font-size:.8rem}.mode-chip{width:27px;height:27px;font-size:1rem}}
.field input[type=text]{padding-right:48px}.station-toggle{position:absolute;right:6px;top:34px;width:36px;height:37px;border:0;background:transparent;color:#526983;font-size:1.5rem;cursor:pointer;border-radius:6px}.station-toggle:hover{background:#eaf2ff}.suggestions{max-height:340px}.suggestions button.active{background:#dbeaff}.suggestions button:focus{background:#dbeaff}
.reverse-button{display:flex;align-items:center;gap:9px;margin:14px auto 0;border:1px solid #b7c4d4;border-radius:24px;padding:8px 15px;background:#f4f8fd;color:#173b65;font:600 .9rem system-ui,sans-serif;cursor:pointer}.reverse-button:hover{background:#e2efff;border-color:#245ba4}.reverse-button:first-letter{font-size:1.2rem}
</style></head><body><header>ELIBHA <span style="font-weight:400">TRANSPORT</span></header><main><h1>Where are you going?</h1><p>Plan journeys across Elibha's railways, Underground, ferries and domestic flights.</p><section class="panel"><div class="fields"><div class="field"><label for="from">From</label><input id="from" type="text" autocomplete="off" placeholder="Type a station or terminal" role="combobox" aria-autocomplete="list" aria-expanded="false"><button id="from-toggle" class="station-toggle" type="button" aria-label="Show all departure stations">⌄</button><div id="from-list" class="suggestions" role="listbox" hidden></div></div><div class="field"><label for="to">To</label><input id="to" type="text" autocomplete="off" placeholder="Type your destination" role="combobox" aria-autocomplete="list" aria-expanded="false"><button id="to-toggle" class="station-toggle" type="button" aria-label="Show all destination stations">⌄</button><div id="to-list" class="suggestions" role="listbox" hidden></div></div></div><button type="button" id="reverse" class="reverse-button" aria-label="Reverse journey direction" title="Swap departure and destination">⇄ <span>Reverse journey</span></button><div class="options"><div><label for="time">Depart after</label><input id="time" type="time" value="05:00"></div><label><input type="checkbox" id="flights"> Include flights</label></div><button class="search" id="search">Find journeys</button><div class="status" id="status" role="status">Loading the timetable…</div></section><section id="results" aria-live="polite"></section><p class="note" id="count"></p></main>
<script type="module" src="./js/app.js?v=20261111-tobacco"></script></body></html>
